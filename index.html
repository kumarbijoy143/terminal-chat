<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Terminal</title>
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/layout.css">
</head>
<body>

  <!-- Top Bar -->
  <header class="chat-header">
    <div class="header-left">
      <span style="font-weight: 600; font-size: 16px; letter-spacing: 0.5px;">CONSOLE 78</span>
    </div>
    
    <div class="header-actions">
      <!-- PUBG Style Speaker Button -->
      <button class="action-btn" id="speakerToggleBtn" onclick="toggleSpeaker()" title="Mute/Unmute Audio">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
          <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
        </svg>
      </button>

      <!-- PUBG Style Mic Button -->
      <button class="action-btn" id="micToggleBtn" onclick="toggleMic()" title="Push/Toggle Mic">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
          <line x1="12" y1="19" x2="12" y2="23"/>
          <line x1="8" y1="23" x2="16" y2="23"/>
        </svg>
      </button>

      <!-- Three-Dot Menu -->
      <button class="action-btn" onclick="openSettings()" title="Settings">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="1"/>
          <circle cx="12" cy="5" r="1"/>
          <circle cx="12" cy="19" r="1"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- Message Area -->
  <main class="chat-stream" id="chatStream"></main>

  <!-- Input Bar -->
  <footer class="chat-input-bar">
    <div class="input-pill">
      <!-- Attachment Paperclip -->
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#8696a0" stroke-width="2">
        <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
      </svg>
      <input type="text" id="msgInput" class="chat-input" placeholder="Secure message..." onkeydown="if(event.key==='Enter') sendCurrentMsg()">
    </div>
    
    <!-- Send Button -->
    <button class="action-btn active-mic" onclick="sendCurrentMsg()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="22" y1="2" x2="11" y2="13"/>
        <polygon points="22 2 15 22 11 13 2 9 22 2"/>
      </svg>
    </button>
  </footer>

  <!-- WhatsApp-Style Settings Modal -->
  <div id="settingsModal" class="modal-overlay" onclick="if(event.target===this) closeSettings()">
    <div class="settings-card">
      <div class="settings-header">Console Settings</div>
      <div class="settings-list">
        
        <!-- Key Row -->
        <div class="settings-item" onclick="promptRelayKey()">
          <div class="settings-item-left">
            <svg class="settings-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            <div class="settings-texts">
              <div class="title">Relay Product Key</div>
              <div class="subtitle" id="subRelayKey">Not Configured</div>
            </div>
          </div>
          <span class="settings-chevron">›</span>
        </div>

        <!-- Offline Vault Row -->
        <div class="settings-item" onclick="promptVaultUrl()">
          <div class="settings-item-left">
            <svg class="settings-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="7 10 12 15 17 10"/>
              <line x1="12" y1="15" x2="12" y2="3"/>
            </svg>
            <div class="settings-texts">
              <div class="title">Offline Vault URL</div>
              <div class="subtitle" id="subVaultUrl">Not Configured</div>
            </div>
          </div>
          <span class="settings-chevron">›</span>
        </div>

        <!-- Font Size Row -->
        <div class="settings-item" onclick="cycleFontSize()">
          <div class="settings-item-left">
            <svg class="settings-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <polyline points="4 7 4 4 20 4 20 7"/>
              <line x1="9" y1="20" x2="15" y2="20"/>
              <line x1="12" y1="4" x2="12" y2="20"/>
            </svg>
            <div class="settings-texts">
              <div class="title">Chat Font Size</div>
              <div class="subtitle" id="subFontSize">15px</div>
            </div>
          </div>
          <span class="settings-chevron">›</span>
        </div>

      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  <script>
    function sendCurrentMsg() {
      const inp = document.getElementById("msgInput");
      const txt = inp.value.trim();
      if (!txt) return;
      renderMessage(txt, "out");
      inp.value = "";
    }
  </script>
</body>
</html>
