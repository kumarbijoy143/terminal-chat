<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>App Launcher</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background-color: #090a0f;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    .header {
      text-align: center;
      margin-bottom: 40px;
    }

    .header h1 {
      font-size: 1.15rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #94a3b8;
    }

    .app-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 28px;
      width: 100%;
      max-width: 320px;
    }

    .app-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      cursor: pointer;
      outline: none;
      transition: transform 0.15s ease;
    }

    .app-item:active {
      transform: scale(0.92);
    }

    /* Android Squircle Base */
    .icon-box {
      width: 76px;
      height: 76px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 10px;
      position: relative;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    /* Production App Styling */
    .prod-box {
      background: linear-gradient(135deg, #059669 0%, #047857 50%, #064e3b 100%);
      box-shadow: 0 10px 25px rgba(5, 150, 105, 0.28);
    }

    /* Testing App Styling */
    .dev-box {
      background: linear-gradient(135deg, #d97706 0%, #b45309 50%, #78350f 100%);
      box-shadow: 0 10px 25px rgba(217, 119, 6, 0.28);
    }

    .icon-box svg {
      width: 38px;
      height: 38px;
      fill: none;
      stroke: #ffffff;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .app-label {
      font-size: 0.85rem;
      font-weight: 500;
      color: #f1f5f9;
      text-align: center;
      letter-spacing: 0.02em;
    }

    .app-tag {
      font-size: 0.65rem;
      margin-top: 2px;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      padding: 2px 6px;
      border-radius: 6px;
    }

    .prod-tag {
      color: #34d399;
      background: rgba(52, 211, 153, 0.1);
    }

    .dev-tag {
      color: #fbbf24;
      background: rgba(251, 191, 36, 0.1);
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>Select Workspace</h1>
  </div>

  <div class="app-grid">
    <!-- App 1: Stable Production -->
    <div class="app-item" onclick="openApp('https://kumarbijoy143.github.io/final-chat/')">
      <div class="icon-box prod-box">
        <svg viewBox="0 0 24 24">
          <polyline points="4 17 10 11 4 5"></polyline>
          <line x1="12" y1="19" x2="20" y2="19"></line>
        </svg>
      </div>
      <span class="app-label">Final Chat</span>
      <span class="app-tag prod-tag">Live</span>
    </div>

    <!-- App 2: Testing & Development -->
    <div class="app-item" onclick="openApp('https://kumarbijoy143.github.io/testing-terminal-chat/')">
      <div class="icon-box dev-box">
        <svg viewBox="0 0 24 24">
          <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path>
        </svg>
      </div>
      <span class="app-label">Testing Chat</span>
      <span class="app-tag dev-tag">Dev</span>
    </div>
  </div>

  <script>
    function openApp(targetUrl) {
      // Uses standard navigation so Android's Back button returns here
      window.location.href = targetUrl;
    }
  </script>

</body>
</html>
